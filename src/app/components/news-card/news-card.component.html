<article class="news-card">
  <div class="news-card__media">
    <img [src]="noticia.imagen" [alt]="noticia.titulo" />
    <button
      type="button"
      class="favorite-toggle"
      [class.active]="isFavorite"
      [attr.aria-pressed]="isFavorite"
      [attr.aria-label]="isFavorite ? 'Quitar de favoritos' : 'Agregar a favoritos'"
      [title]="isFavorite ? 'Quitar de favoritos' : 'Agregar a favoritos'"
      (click)="toggleFavorito($event)"
    >
      <span aria-hidden="true">♥</span>
    </button>
  </div>

  <div class="news-card__body">
    <span class="news-card__category" [class]="categoriaClass">{{ noticia.categoria }}</span>
    <h3>{{ noticia.titulo }}</h3>
    <p>{{ noticia.descripcion }}</p>

    <div class="news-card__meta">
      <span>{{ noticia.fecha | date: 'longDate' }}</span>
      <span>{{ noticia.autor }}</span>
    </div>

    <a class="news-card__button" [routerLink]="['/detalle-noticia', noticia.id]">Ver más</a>
  </div>
</article>
