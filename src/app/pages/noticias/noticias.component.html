<section class="page-hero container">
  <span class="eyebrow">Inicio / Noticias</span>
  <h1>Listado de noticias</h1>
</section>

<section class="container toolbar">
  <!-- Two-way binding entre componentes: [(seleccionada)] = @Input + @Output -->
  <app-category-filter [categorias]="categorias" [(seleccionada)]="categoriaSeleccionada" />

  <div class="search-box">
    <input
      type="search"
      [(ngModel)]="searchTerm"
      placeholder="Buscar noticia..."
      aria-label="Buscar noticia"
    />
  </div>
</section>

<section class="container results">
  <p>
    {{ noticiasFiltradas.length }}
    {{ noticiasFiltradas.length === 1 ? 'noticia encontrada' : 'noticias encontradas' }}
  </p>
</section>

<section class="container">
  <div class="news-grid">
    @for (noticia of noticiasFiltradas; track noticia.id) {
      <app-news-card [noticia]="noticia" />
    } @empty {
      <div class="empty-state">
        <p>No hay noticias que coincidan con tu búsqueda.</p>
        <button type="button" class="clear-btn" (click)="limpiarFiltros()">Limpiar filtros</button>
      </div>
    }
  </div>
</section>
