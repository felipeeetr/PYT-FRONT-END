# Compila la app Angular y la publica en GitHub Pages cada vez que se actualiza main.
# Requisito (una sola vez, lo hace un administrador del repo):
#   Settings → Pages → Build and deployment → Source: "GitHub Actions".
name: Desplegar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Por defecto los jobs solo pueden leer el código; el job deploy pide los permisos de Pages.
permissions:
  contents: read

# Solo un despliegue a la vez: no cancela uno en curso y salta los intermedios que estén en cola.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v7

      - name: Instalar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      # La app se sirve en https://<usuario>.github.io/<repositorio>/, por eso el base-href.
      - name: Compilar Angular
        run: npx ng build --base-href "/${{ github.event.repository.name }}/"

      # GitHub Pages no conoce las rutas de Angular: si alguien recarga /noticias responde 404.
      # Copiando index.html como 404.html, Pages carga la app y el router muestra la página correcta.
      - name: Soporte para rutas de Angular (404.html)
        run: cp dist/pyt-front-end/browser/index.html dist/pyt-front-end/browser/404.html

      - name: Configurar Pages
        uses: actions/configure-pages@v6

      - name: Subir el sitio compilado
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist/pyt-front-end/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
